name: Build and Release APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Extract version from build.gradle
      id: get_version
      run: |
        VERSION_NAME=$(grep "VERSION_NAME = " Hyperrail/build.gradle | sed "s/def VERSION_NAME = '\(.*\)'/\1/")
        VERSION_CODE=$(grep "VERSION_CODE = " Hyperrail/build.gradle | sed "s/def VERSION_CODE = \(.*\)/\1/")
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "Building version $VERSION_NAME (code $VERSION_CODE)"

    - name: Build release APK
      run: ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Sign APK (if keystore available)
      if: env.KEYSTORE_FILE != ''
      env:
        KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "Keystore found, APK will be signed"
        # Signing step would go here if secrets are configured
        # For now, we'll use the unsigned APK

    - name: Rename APK
      run: |
        VERSION_NAME=${{ steps.get_version.outputs.version_name }}
        mv Hyperrail/build/outputs/apk/release/*.apk Hyperrail/build/outputs/apk/release/hyperrail-$VERSION_NAME.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.get_version.outputs.version_name }}
        name: HyperRail v${{ steps.get_version.outputs.version_name }}
        body: |
          ## HyperRail v${{ steps.get_version.outputs.version_name }}

          **Build:** ${{ steps.get_version.outputs.version_code }}
          **Commit:** ${{ github.sha }}

          ### Installation
          1. Download the APK below
          2. Enable "Install from unknown sources" in Android settings
          3. Install the APK

          ### Changes
          See commit history for full details.

          ---
          *Automatically generated from commit ${{ github.sha }}*
        files: |
          Hyperrail/build/outputs/apk/release/hyperrail-${{ steps.get_version.outputs.version_name }}.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
